[project]
name = "yovus-ecommerce-finance"
version = "0.1.0"
description = "中国电商财务对账系统 - 核算、对账、申报、利润分析、预算预警、AI分析"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=24.0.0",
    "anthropic>=0.40.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
full = [
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.28.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "xlsxwriter>=3.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
